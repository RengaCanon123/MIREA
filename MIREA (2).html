<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MIREA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Concepto: app móvil en una columna, tarjetas suaves sobre fondo crema, navegación inferior con "Analizar" al centro. */
:root{
  --bg:#FFF4EE;--surface:#FFFBF8;--ink:#3D1F33;--ink2:#6B4A60;--line:#F0D8D0;
  --coral:#F4616F;--pink:#F9A8B8;--peach:#FFC9B0;--lav:#D4C1F2;--plum:#3D1F33;
  --accent:#C2314F;
  --ok:#5FAE8B;--okink:#2C7556;--okbg:#E2F3EA;
  --warn:#F2A93B;--warnink:#8A5600;--warnbg:#FFF0D4;
  --crit:#D63E5C;--critink:#B0213F;--critbg:#FFE2E7;
  --lavbg:#EEE6FB;--pinkbg:#FDE4EA;--peachbg:#FFEADF;
  --btn:#D63E5C;--btnh:#BF3150;
  --hero-a:#FFC9B0;--hero-b:#F9A8B8;--onhero:#3D1F33;
  --shadow:0 8px 24px rgba(61,31,51,.10);
  --fd:'Fraunces',Georgia,serif;
  --fb:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2A1425;--surface:#3A1D33;--ink:#FFF4EE;--ink2:#D8BCCB;--line:#5C3552;
  --accent:#FF8798;
  --okink:#8FD9B6;--okbg:#21433A;--warnink:#F7C46E;--warnbg:#4B3A1B;--critink:#FF9FB0;--critbg:#5B2237;
  --lavbg:#40345A;--pinkbg:#4E2641;--peachbg:#4A2F33;
  --hero-a:#7A3452;--hero-b:#5E2848;--onhero:#FFF4EE;
  --shadow:0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2A1425;--surface:#3A1D33;--ink:#FFF4EE;--ink2:#D8BCCB;--line:#5C3552;
  --accent:#FF8798;
  --okink:#8FD9B6;--okbg:#21433A;--warnink:#F7C46E;--warnbg:#4B3A1B;--critink:#FF9FB0;--critbg:#5B2237;
  --lavbg:#40345A;--pinkbg:#4E2641;--peachbg:#4A2F33;
  --hero-a:#7A3452;--hero-b:#5E2848;--onhero:#FFF4EE;
  --shadow:0 8px 24px rgba(0,0,0,.35);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--fb);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:0;padding-bottom:0}
button{font-family:inherit}
h1,h2,h3{font-family:var(--fd);line-height:1.15;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:30px}h2{font-size:23px}h3{font-size:18px}
p{margin:0}
.app{max-width:480px;margin:0 auto;padding-bottom:112px}
.muted{color:var(--ink2)}
.sm{font-size:14px}.xs{font-size:13px}
.b{font-weight:800}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.sec{margin-top:26px;display:grid;gap:12px}
.sec>h2,.sec>h3{margin-bottom:2px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.ic{flex:none}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 6px}
.brand{display:flex;align-items:center;gap:10px;font:700 25px/1 var(--fd);letter-spacing:.03em}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--lav);color:#3D1F33;font:800 18px var(--fb);border:0;cursor:pointer}

/* buttons */
.btn{appearance:none;border:0;cursor:pointer;font:800 16px var(--fb);min-height:48px;padding:0 22px;border-radius:999px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--btn);color:#fff;text-decoration:none;text-align:center}
.btn:hover{background:var(--btnh)}
.btn.soft{background:var(--pinkbg);color:var(--ink)}
.btn.soft:hover{background:var(--peach);color:#3D1F33}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.line:hover{background:var(--pinkbg)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 16px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);font:800 15px var(--fb);cursor:pointer;text-decoration:underline;padding:8px 0;min-height:44px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.card.tint{background:var(--lavbg);border-color:transparent}
.card.warm{background:var(--peachbg);border-color:transparent}
.hero{border-radius:26px;padding:22px 20px;background:linear-gradient(140deg,var(--hero-a),var(--hero-b));color:var(--onhero);display:grid;gap:10px;position:relative;overflow:hidden}
.hero .blob{position:absolute;right:-30px;top:-30px;opacity:.55;pointer-events:none}
.hero>*{position:relative}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font:800 13px var(--fb);width:fit-content}
.b-ok{background:var(--okbg);color:var(--okink)}
.b-warn{background:var(--warnbg);color:var(--warnink)}
.b-crit{background:var(--critbg);color:var(--critink)}
.b-lav{background:var(--lavbg);color:var(--ink)}
.b-mirea{background:var(--btn);color:#fff}
.note{border-radius:16px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start;background:var(--lavbg)}
.note.crit{background:var(--critbg);color:var(--critink)}
.note.warn{background:var(--warnbg);color:var(--warnink)}
.note.ok{background:var(--okbg);color:var(--okink)}

/* segmented */
.seg{display:flex;gap:4px;padding:4px;background:var(--lavbg);border-radius:999px;margin-top:14px}
.seg button{flex:1;min-height:44px;border:0;border-radius:999px;background:transparent;color:var(--ink);font:800 14px var(--fb);cursor:pointer;padding:0 6px}
.seg button.on{background:var(--surface);box-shadow:0 2px 8px rgba(61,31,51,.14)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;min-height:44px;padding:0 14px;font:700 14px var(--fb);cursor:pointer}
.chip.on{background:var(--pinkbg);border-color:var(--coral)}
.chip:hover{border-color:var(--coral)}

/* forms */
.field{display:grid;gap:6px;margin-top:14px}
.field label,.field .lb{font-weight:800;font-size:14px}
input[type=text],input[type=email],input[type=password],select{font:inherit;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;width:100%}
input::placeholder{color:var(--ink2);opacity:.8}
.err{color:var(--critink);font-weight:700;font-size:14px;margin-top:10px}
.tg{display:flex;align-items:center;gap:12px;cursor:pointer;min-height:44px}
.tg input{position:absolute;opacity:0;width:1px;height:1px}
.tg .sw{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tg .sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tg input:checked+.sw{background:var(--ok)}
.tg input:checked+.sw::after{transform:translateX(20px)}
.tg input:focus-visible+.sw{outline:3px solid var(--ink);outline-offset:2px}
.ck{display:flex;gap:12px;align-items:flex-start;min-height:44px;cursor:pointer;padding:6px 0}
.ck input{width:22px;height:22px;margin-top:2px;accent-color:var(--btn);flex:none}

/* options (test) */
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;min-height:56px;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 16px var(--fb);cursor:pointer;margin-top:10px}
.opt .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink2);flex:none;display:grid;place-items:center}
.opt.multi .dot{border-radius:7px}
.opt[aria-pressed="true"]{border-color:var(--coral);background:var(--pinkbg)}
.opt[aria-pressed="true"] .dot{background:var(--coral);border-color:var(--coral)}
.opt[aria-pressed="true"] .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.opt.multi[aria-pressed="true"] .dot::after{border-radius:2px}
.prog{height:10px;border-radius:99px;background:var(--lavbg);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--coral);border-radius:99px;transition:width .3s}

/* nav */
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,480px);display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.nav button{border:0;background:none;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px;font:700 12px var(--fb);min-height:56px;cursor:pointer;padding:4px 0;border-radius:14px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"] .ib{background:var(--pinkbg)}
.nav .ib{width:52px;height:30px;border-radius:99px;display:grid;place-items:center}
.nav .mid .ib{width:54px;height:54px;margin-top:-26px;background:var(--coral);color:#fff;box-shadow:var(--shadow);border:4px solid var(--surface)}
.nav .mid[aria-current="page"] .ib{background:var(--coral)}
.nav .mid span.t{margin-top:-2px}

[hidden]{display:none!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--plum);color:#FFF4EE;padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:40;max-width:min(92vw,420px);box-shadow:var(--shadow)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toast{background:#FFF4EE;color:#3D1F33}}
:root[data-theme="dark"] .toast{background:#FFF4EE;color:#3D1F33}

/* lists */
.li{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.tile{display:grid;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:14px;cursor:pointer;font:inherit;min-height:104px;align-content:start}
.tile .ibx{width:40px;height:40px;border-radius:14px;display:grid;place-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ibx.c1{background:var(--pinkbg);color:var(--accent)}
.ibx.c2{background:var(--lavbg);color:var(--ink)}
.ibx.c3{background:var(--peachbg);color:var(--accent)}
.ibx.c4{background:var(--okbg);color:var(--okink)}

/* scanner */
.scan{aspect-ratio:1/1;max-width:280px;margin:0 auto;border-radius:24px;background:var(--plum);position:relative;display:grid;place-items:center;overflow:hidden}
.scan .corner{position:absolute;width:46px;height:46px;border:5px solid var(--coral);border-radius:10px}
.scan .c1{left:16px;top:16px;border-right:0;border-bottom:0}.scan .c2{right:16px;top:16px;border-left:0;border-bottom:0}
.scan .c3{left:16px;bottom:16px;border-right:0;border-top:0}.scan .c4{right:16px;bottom:16px;border-left:0;border-top:0}
.scan .qr{width:132px;height:132px;border-radius:10px}
.scan .beam{position:absolute;left:24px;right:24px;height:4px;border-radius:4px;background:var(--pink);box-shadow:0 0 18px var(--coral);top:24px}
.scan.go .beam{animation:beam 1.6s ease-in-out infinite alternate}
@keyframes beam{to{top:calc(100% - 28px)}}
#heat{width:100%;height:auto;border-radius:20px;display:block;aspect-ratio:640/420;background:#2A1425}
.legend{height:12px;border-radius:99px;background:linear-gradient(90deg,#7B5FB5,#D4C1F2,#F9A8B8,#F4616F,#F2A93B,#FFF4EE)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.kv:first-child{border-top:0}
.kv .v{font-weight:800;text-align:right}

/* chat */
.msgs{display:grid;gap:10px;margin-top:14px}
.bub{max-width:88%;padding:12px 14px;border-radius:18px;font-size:15.5px;display:grid;gap:8px}
.bub p+p{margin-top:0}
.bub ul{margin:0;padding-left:20px;display:grid;gap:4px}
.bub.bot{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px;justify-self:start}
.bub.me{background:var(--btn);color:#fff;border-bottom-right-radius:6px;justify-self:end}
.typing{display:flex;gap:4px;padding:14px 16px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--ink2);animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
.cform{display:flex;gap:8px;margin-top:14px}
.cform input{flex:1;min-width:0}
.cform .btn{padding:0 18px}

/* massage */
.mdia{width:100%;max-width:340px;margin:0 auto;display:block}
.kv .v{min-width:0}
.m-breast{fill:var(--peachbg);stroke:var(--pink);stroke-width:3}
.m-axil{fill:var(--lavbg);stroke:var(--lav);stroke-width:2}
.m-clav{stroke:var(--line);stroke-width:3;stroke-linecap:round;fill:none}
.m-areola{fill:var(--pinkbg);stroke:var(--pink);stroke-width:2}
.m-nip{fill:var(--coral)}
.m-t{font:700 11px var(--fb);fill:var(--ink2)}
.m-path{fill:none;stroke:var(--ink2);stroke-opacity:.45;stroke-width:2;stroke-dasharray:2 6;stroke-linecap:round}
.m-trail{fill:none;stroke:var(--coral);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.9}
.m-dot{fill:var(--accent);stroke:#fff;stroke-width:3}
.press{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.press button{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;min-height:56px;font:800 14px var(--fb);cursor:pointer;display:grid;gap:4px;place-items:center;padding:8px 4px}
.press button i{display:block;height:6px;border-radius:6px;background:var(--line);width:70%}
.press button.on{border-color:var(--coral);background:var(--pinkbg)}
.press button.on i{background:var(--coral)}
.steps{display:flex;gap:6px;justify-content:center}
.steps button{width:14px;height:14px;border-radius:50%;border:0;background:var(--line);padding:0;cursor:pointer;position:relative}
.steps button::after{content:"";position:absolute;inset:-14px -3px}
.steps button.on{background:var(--coral);width:30px;border-radius:8px}
.steps button.dn{background:var(--ok)}
.breath{width:130px;height:130px;border-radius:50%;margin:8px auto;background:radial-gradient(circle,var(--pink),var(--lav));animation:breathe 8s ease-in-out infinite;display:grid;place-items:center;font:800 14px var(--fb);color:#3D1F33}
@keyframes breathe{0%,100%{transform:scale(.7)}50%{transform:scale(1.05)}}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font:800 12px var(--fb);color:var(--ink2);padding:4px 0}
.cal button{aspect-ratio:1/1;min-height:42px;border:0;border-radius:14px;background:transparent;color:var(--ink);font:700 15px var(--fb);cursor:pointer;display:grid;place-items:center;align-content:center;gap:2px;position:relative}
.cal button.out{visibility:hidden}
.cal button[disabled]{color:var(--ink2);opacity:.4;cursor:not-allowed}
.cal button.today{box-shadow:inset 0 0 0 2px var(--coral)}
.cal button.sel{background:var(--btn);color:#fff}
.cal button.can{background:var(--pinkbg)}
.cal button.can.sel{background:var(--btn)}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%}
.d-cesfam{background:var(--coral)}.d-tele{background:var(--lav);box-shadow:0 0 0 1.5px var(--ink2)}.d-farm{background:var(--warn)}.d-self{background:var(--ok)}
.cal button.sel .dots i{box-shadow:0 0 0 1.5px #fff}
.legend2{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--ink2)}
.legend2 span{display:flex;align-items:center;gap:6px}
.legend2 i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* accordion */
details.acc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:0 16px}
details.acc summary{list-style:none;cursor:pointer;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;font:800 16px var(--fb)}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";font:800 22px var(--fb);color:var(--accent)}
details.acc[open] summary::after{content:"–"}
details.acc .bd{padding:0 0 16px;display:grid;gap:10px;font-size:15.5px}
details.acc ul{margin:0;padding-left:20px;display:grid;gap:6px}
.tbl{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
.tbl table{border-collapse:collapse;min-width:520px;width:100%;font-size:14px}
.tbl th,.tbl td{padding:10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{background:var(--lavbg)}

/* overlay (llamada) */
#overlay{position:fixed;inset:0;background:#2A1425;color:#FFF4EE;z-index:60;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#overlay .box{width:100%;max-width:420px;display:grid;gap:18px;text-align:center;justify-items:center}
.pavatar{width:128px;height:128px;border-radius:50%;background:linear-gradient(140deg,#F9A8B8,#D4C1F2);color:#3D1F33;display:grid;place-items:center;font:700 52px var(--fd)}
.cbtn{width:60px;height:60px;border-radius:50%;border:0;background:#4E2641;color:#FFF4EE;display:grid;place-items:center;cursor:pointer}
.cbtn.off{background:#FFF4EE;color:#3D1F33}
.cbtn.end{background:#D63E5C;color:#fff}
.cbtn[disabled]{opacity:.4;cursor:not-allowed}
#overlay .tg .sw{background:#5C3552}
#overlay .tg input:checked+.sw{background:#5FAE8B}

.welcome .hero{padding:30px 22px 26px;gap:14px}
.wm{font:700 58px/1 var(--fd);letter-spacing:.04em}
.tag{font:600 21px/1.25 var(--fd)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app"></div>
<div id="overlay" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
(function(){
'use strict';
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromIso=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmt=(s,o)=>fromIso(s).toLocaleDateString('es-CL',o||{weekday:'short',day:'numeric',month:'short'});
const ymk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const hash=s=>{let h=5381;for(const c of s){h=((h<<5)+h+c.charCodeAt(0))>>>0}return h.toString(36)};
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const uid=()=>Math.random().toString(36).slice(2,9);

const P={

function mix(a,b,t){const h=x=>[1,3,5].map(i=>parseInt(x.substr(i,2),16));const A=h(a),B=h(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'}
function drawHeat(cv,r){
  const W=cv.width,H=cv.height,c=cv.getContext('2d');
  c.fillStyle='#2A1425';c.fillRect(0,0,W,H);
  let g=c.createRadialGradient(W/2,H*.5,10,W/2,H*.55,W*.5);
  g.addColorStop(0,'#9B7BD0');g.addColorStop(.7,'#6D4FA3');g.addColorStop(1,'#3B2354');
  c.fillStyle=g;c.beginPath();c.ellipse(W/2,H*.64,W*.47,H*.62,0,0,7);c.fill();
  const cy=H*.5,R=H*.34,cs={R:W*.29,L:W*.71},T={R:r.tR,L:r.tL};
  ['R','L'].forEach(side=>{
    const cx=cs[side],w=Math.max(0,Math.min(1,(T[side]-32.5)/2.5));
    const bg=c.createRadialGradient(cx,cy,R*.1,cx,cy,R);
    bg.addColorStop(0,mix('#D4C1F2','#F9A8B8',w));bg.addColorStop(.6,mix('#9B7BD0','#D4C1F2',w));bg.addColorStop(1,'rgba(109,79,163,0)');
    c.fillStyle=bg;c.beginPath();c.arc(cx,cy,R,0,7);c.fill();
    if(r.hot&&r.hot.side===side){
      const hx=cx+r.hot.dx*R,hy=cy+r.hot.dy*R,hr=R*(.45+r.hot.int*.3),i=r.hot.int;
      const hg=c.createRadialGradient(hx,hy,2,hx,hy,hr);
      hg.addColorStop(0,'rgba(255,244,238,'+i+')');hg.addColorStop(.25,'rgba(242,169,59,'+i+')');
      hg.addColorStop(.6,'rgba(244,97,111,'+(i*.75)+')');hg.addColorStop(1,'rgba(244,97,111,0)');
      c.fillStyle=hg;c.beginPath();c.arc(hx,hy,hr,0,7);c.fill();
    }
    const ng=c.createRadialGradient(cx,cy,0,cx,cy,R*.14);
    ng.addColorStop(0,'rgba(75,45,120,.55)');ng.addColorStop(1,'rgba(75,45,120,0)');
    c.fillStyle=ng;c.beginPath();c.arc(cx,cy,R*.14,0,7);c.fill();
    c.strokeStyle='rgba(255,244,238,.28)';c.lineWidth=2.4;c.lineCap='round';
    const dir=side==='R'?-1:1,irr=r.k===3&&side==='R'?1:0;
    for(let i=0;i<3;i++){
      const sx=cx+dir*R*(.95-i*.12),sy=cy-R*(.55-i*.3);
      c.beginPath();c.moveTo(sx,sy);
      c.bezierCurveTo(cx+dir*R*.5,sy-R*.2+(irr?R*.3*(i-1):0),cx+dir*R*.2,cy+(irr?R*.3:0)-R*.05*i,cx+dir*R*.06,cy+R*(.1+i*.08));
      c.stroke();
    }
  });
  c.fillStyle='#FFF4EE';c.font='700 22px Nunito, sans-serif';c.textAlign='center';
  c.fillText('Derecha',cs.R,H-16);c.fillText('Izquierda',cs.L,H-16);
}

/* ---------- eventos / calendario ---------- */
function events(){
  const ev=S.appts.map(a=>({id:a.id,date:a.date,time:a.time,title:a.title,sub:a.place,type:a.type,appt:true}));
  if(S.remind.self){const t=today();for(let m=-1;m<=3;m++){
    const d=new Date(t.getFullYear(),t.getMonth()+m,Math.min(S.selfDay,28)),k=ymk(d),dn=!!(S.done[k]&&S.done[k].self);
    ev.push({date:iso(d),title:'Autoexamen mensual',sub:dn?'Hecho':'Pendiente',type:'self',done:dn});
  }}
  return ev.sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
}
const TYPE_N={cesfam:'CESFAM',tele:'Teleconsulta',farm:'Farmacia',self:'Autoexamen'};
function calHTML(mode){
  const t=today(),base=new Date(t.getFullYear(),t.getMonth()+U.cal,1);
  const first=(base.getDay()+6)%7,days=new Date(base.getFullYear(),base.getMonth()+1,0).getDate();
  const ev=events(),by={};ev.forEach(e=>{(by[e.date]=by[e.date]||[]).push(e)});
  const sel=mode==='pick'?(U.book&&U.book.date):U.calSel;
  let cells='';for(let i=0;i<first;i++)cells+='<button class="out" tabindex="-1" aria-hidden="true"></button>';
  for(let d=1;d<=days;d++){
    const dt=new Date(base.getFullYear(),base.getMonth(),d),k=iso(dt),dow=dt.getDay();
    const can=mode==='pick'&&dt>t&&dow>0&&dow<6&&(d%7!==3);
    const dis=mode==='pick'&&!can;
    const dots=(by[k]||[]).slice(0,3).map(e=>`<i class="d-${e.type}"></i>`).join('');
    cells+=`<button data-act="cal-day" data-d="${k}" class="${k===iso(t)?'today ':''}${sel===k?'sel ':''}${can?'can':''}" ${dis?'disabled':''} aria-label="${fmt(k,{weekday:'long',day:'numeric',month:'long'})}${can?', con cupos':''}"><span>${d}</span><span class="dots">${dots}</span></button>`;
  }
  const title=base.toLocaleDateString('es-CL',{month:'long',year:'numeric'});
  return `<div class="row sp"><button class="btn line sm" data-act="cal-prev" aria-label="Mes anterior" ${U.cal<=0&&mode==='pick'?'disabled':''}>${ic('left',18)}</button><h3 style="text-transform:capitalize">${title}</h3><button class="btn line sm" data-act="cal-next" aria-label="Mes siguiente">${ic('right',18)}</button></div>
  <div class="cal" style="margin-top:10px">${['L','M','M','J','V','S','D'].map(x=>`<div class="h" aria-hidden="true">${x}</div>`).join('')}${cells}</div>`;
}

/* automasaje interactivo */
const CX=130,CY=140;
const PAT={
 spiral:{T:14,n:'Círculos hacia el centro'},
 strips:{T:16,n:'Franjas de arriba abajo'},
 wedge:{T:13,n:'Rayos desde el pezón'}
};
function pts(k){
  const a=[];
  if(k==='spiral'){for(let i=0;i<=240;i++){const t=i/240,ang=t*3*2*Math.PI-Math.PI/2,r=82*(1-t)+8;a.push([CX+r*Math.cos(ang),CY+r*Math.sin(ang)])}}
  else if(k==='strips'){let up=false;for(let x=62;x<=198;x+=22){const h=Math.sqrt(Math.max(0,88*88-(x-CX)*(x-CX)))*.92,y1=CY-h,y2=CY+h;if(up){a.push([x,y2],[x,y1])}else{a.push([x,y1],[x,y2])}up=!up}}
  else{for(let i=0;i<8;i++){const ang=i*Math.PI/4-Math.PI/2,x=CX+84*Math.cos(ang),y=CY+84*Math.sin(ang);a.push([CX+14*Math.cos(ang),CY+14*Math.sin(ang)],[x,y])}}
  return a;
}

 {t:'Recorre por franjas',pat:'strips',tech:'strips',p:['Sube y baja en líneas verticales, como si cortaras el pasto, cubriendo toda la mama.','Incluye la zona de la axila y sube hasta la clavícula: ahí también hay tejido mamario.']},

function ensureSess(){const t=iso(today());if(!U.sess||U.sess.date!==t)U.sess={id:uid(),date:t};return U.sess}
function logTech(tech,finds,side){const ss=ensureSess();S.logs=S.logs.filter(l=>!(l.sess===ss.id&&l.tech===tech));S.logs.unshift({id:uid(),sess:ss.id,date:ss.date,tech:tech,none:!finds.length,finds:finds,side:side||''});save()}
function sessions(){const m={},o=[];S.logs.forEach(l=>{if(!m[l.sess]){m[l.sess]={id:l.sess,date:l.date,items:[]};o.push(m[l.sess])}m[l.sess].items.push(l)});return o.sort((a,b)=>b.date.localeCompare(a.date))}
function recallFor(tech){
  if(!tech)return null;const cur=U.sess&&U.sess.id;
  for(const ss of sessions()){if(ss.id===cur)continue;const it=ss.items.find(l=>l.tech===tech&&l.finds.length);if(it)return{date:ss.date,it:it}}

function repeatAlerts(){

  return Object.keys(by).map(k=>{const d=Object.values(by[k]).sort();return{k:k,n:d.length,dates:d}}).filter(a=>a.n>=2);
}

let raf=0;
function stopAnim(){cancelAnimationFrame(raf);raf=0}
function startAnim(){
  const s=MS[U.mstep];if(!s.pat||U.mdone)return;
  const path=$('#mpath'),dot=$('#mdot'),trail=$('#mtrail');if(!path)return;
  const len=path.getTotalLength(),T=PAT[s.pat].T*1000;
  trail.style.strokeDasharray=len+' '+len;
  let last=performance.now(),lastPr=-1;
  function frame(now){
    if(U.mplay)U.mAcc+=now-last;last=now;
    const loops=Math.floor(U.mAcc/T),p=(U.mAcc%T)/T,pt=path.getPointAtLength(p*len);
    dot.setAttribute('cx',pt.x);dot.setAttribute('cy',pt.y);trail.style.strokeDashoffset=len*(1-p);
    const pr=loops%3;
    if(pr!==lastPr){lastPr=pr;dot.setAttribute('r',7+pr*2);
      for(let i=0;i<3;i++){const b=$('#pr'+i);if(b){b.classList.toggle('on',i===pr);b.setAttribute('aria-pressed',i===pr)}}
      const d=$('#prd');if(d)d.textContent=PR[pr][1]}
    if(U.mplay)raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
}

/* ---------- términos y consentimiento ---------- */
function termsContent(){

   <li>Guardamos tus respuestas, autoexámenes, exámenes y citas para armar tu plan y tu historial.</li>
   <li>Son <b>datos de salud</b>. Solo los usamos con tu autorización y tú decides cuándo compartirlos.</li>
   <li>Puedes ver, corregir o borrar tus datos cuando quieras desde Mi plan.</li></ul></div>
  <div class="stack" style="margin-top:16px">
  ${A('1. Qué es MIREA y qué no es','<p>MIREA es una app educativa de apoyo al cuidado de las mamas: enseña el autoexamen, explica resultados de termografía y ayuda a organizar controles y horas.</p><p>La información que entrega es orientativa. <b>No es un diagnóstico, no es una indicación médica y no reemplaza la evaluación de un profesional.</b> La termografía es un examen complementario y no reemplaza a la mamografía. Un resultado normal no descarta enfermedad.</p><p>MIREA no es un servicio de urgencias. Ante dolor intenso, sangrado o fiebre alta, llama al 131.</p>')}
  ${A('2. Quiénes pueden usarla','<p>Está pensada para personas mayores de 18 años. Si eres menor de edad, debe acompañarte y autorizarte tu madre, padre o representante legal.</p>')}
  ${A('3. Qué datos usamos','<ul><li><b>Cuenta:</b> nombre, correo y si vives en zona urbana o rural.</li><li><b>Salud:</b> respuestas del test inicial (edad, antecedentes familiares y personales, hábitos), lo que anotas en tus autoexámenes y los resultados de tus exámenes de termografía.</li><li><b>Atención:</b> horas pedidas en CESFAM, teleconsultas y reservas en farmacias.</li></ul><p>Los datos sobre tu salud son <b>datos sensibles</b>. Solo pedimos los necesarios para las funciones de la app.</p>')}
  ${A('4. Para qué los usamos','<ul><li>Armar tu plan de controles y tus recordatorios.</li><li>Mostrarte tu historial y recordar lo que anotaste en autoexámenes anteriores, para que puedas compararlo.</li><li>Avisarte cuando algo se repite y conviene consultarlo.</li><li>Opcional, solo si lo aceptas: mejorar MIREA con datos sin identificar.</li></ul><p>No vendemos tus datos ni los usamos para publicidad.</p>')}
  ${A('5. Con quién se comparten','<p>No compartimos tu información de salud con nadie sin que tú lo decidas. Por ejemplo, tu informe de termografía solo se comparte con un profesional cuando activas esa opción, y puedes desactivarla después.</p><p>Si MIREA se conecta con farmacias, CESFAM o teleconsulta, te pediremos tu autorización específica antes de enviar tus datos a cada uno.</p>')}
  ${A('6. Dónde se guardan y por cuánto tiempo','<p>En esta versión de demostración, tus datos se guardan solo en este dispositivo y navegador. Si borras los datos del navegador o desinstalas, se pierden.</p><p>Se conservan mientras uses la app, y puedes borrarlos cuando quieras.</p>')}
  ${A('7. Tus derechos','<p>Según la normativa chilena de protección de datos personales (Ley 19.628 y la Ley 21.719), puedes pedir acceso a tus datos, corregirlos, eliminarlos y oponerte a su uso.</p><p>Puedes <b>retirar tu consentimiento</b> en cualquier momento desde <b>Mi plan, Mi cuenta, Retirar consentimiento y borrar mis datos</b>. Al hacerlo se elimina tu historial y no podrás seguir usando las funciones que dependen de él.</p>')}
  ${A('8. Exámenes, termografía y telemedicina','<p>Los informes de termografía los realizan y entregan las farmacias de la Red MIREA. MIREA los explica en palabras simples, pero la interpretación clínica corresponde a un profesional de salud.</p><p>Las teleconsultas las realizan profesionales de salud. Lo que se converse en ellas es una atención clínica aparte de MIREA.</p>')}
  ${A('9. Tus responsabilidades','<ul><li>Entregar información verdadera y mantenerla al día.</li><li>Cuidar tu contraseña y tu dispositivo.</li><li>Consultar a un profesional ante cualquier cambio en tus mamas, aunque la app no te lo indique.</li></ul>')}
  ${A('10. Cambios a estos términos','<p>Si cambian estos términos o la forma de usar tus datos, te avisaremos y te pediremos aceptar de nuevo antes de continuar.</p>')}

/* ---------- QR completo ---------- */
function qrSvg(){
  const N=25,M=[];for(let y=0;y<N;y++)M.push(new Array(N).fill(null));
  const finder=(ox,oy)=>{for(let y=-1;y<=7;y++)for(let x=-1;x<=7;x++){const X=ox+x,Y=oy+y;if(X<0||Y<0||X>=N||Y>=N)continue;let v=0;if(x>=0&&x<=6&&y>=0&&y<=6)v=(x===0||x===6||y===0||y===6||(x>=2&&x<=4&&y>=2&&y<=4))?1:0;M[Y][X]=v}};
  finder(0,0);finder(N-7,0);finder(0,N-7);
  for(let i=8;i<N-8;i++){M[6][i]=i%2===0?1:0;M[i][6]=i%2===0?1:0}
  for(let y=-2;y<=2;y++)for(let x=-2;x<=2;x++)M[18+y][18+x]=Math.max(Math.abs(x),Math.abs(y))!==1?1:0;
  M[N-8][8]=1;
  let s=2026;const rnd=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff};
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(M[y][x]===null)M[y][x]=rnd()<.48?1:0;
  let r='';for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(M[y][x])r+=`<rect x="${x+2}" y="${y+2}" width="1.02" height="1.02"/>`;
  return `<svg class="qr" viewBox="0 0 29 29" aria-hidden="true"><rect width="29" height="29" rx="2" fill="#FFF4EE"/><g fill="#3D1F33" shape-rendering="crispEdges">${r}</g></svg>`;
}

function reply(q){

  KB.forEach(e=>{let s=0;e.k.forEach(k=>{if(n.includes(norm(k)))s+=k.length>6?2:1});if(s>bs){bs=s;best=e}});
  if(best)return{w:'bot',h:best.a,go:best.go};
  return{w:'bot',h:'<p>Todavía no tengo una respuesta preparada para eso. Puedo ayudarte con: cómo revisarte, cuándo hacerlo, señales de alerta, termografía, mamografía, factores de riesgo y cómo pedir hora.</p><p>Si es algo que te preocupa de tu salud, lo mejor es consultarlo con un profesional.</p>',go:{l:'Pedir hora',t:'atencion',s:'cesfam'}};
}

function act(a,d){
  switch(a){
  case 'auth-mode':U.auth=d.m;U.err='';render();window.scrollTo(0,0);break;
  case 'demo':{if(!(U.cons.a&&U.cons.b)){U.err='Marca las dos casillas obligatorias para continuar.';render();break}
    S=blank();S.user={name:'Visita',email:'',zone:'urbana',h:'',consent:{v:1,at:iso(today()),stats:!!U.cons.c}};save();U.out=false;U.chat=null;U.cons={};U.err='';U.form=null;U.testStarted=false;U.testI=0;U.testA={};render();window.scrollTo(0,0);break}
  case 'test-start':U.testStarted=true;U.testI=0;U.testA={};render();window.scrollTo(0,0);break;
  case 'terms-ok':{if(!(U.cons.a&&U.cons.b))break;const c={v:1,at:iso(today()),stats:!!U.cons.c};
    if(S.user&&!S.user.consent){S.user.consent=c;save();U.out=false}
    else if(U.next==='demo'){S=blank();S.user={name:'Visita',email:'',zone:'urbana',h:'',consent:c};save();U.out=false;U.chat=null;U.testI=0;U.testA={}}
    else{U.pend=c;U.auth='register'}
    U.cons={};render();window.scrollTo(0,0);break}
  case 'terms-no':if(S.user&&!S.user.consent)U.out=true;U.auth='register';U.cons={};render();window.scrollTo(0,0);break;
  case 'test-pick':{const q=TQ[U.testI],i=+d.i;if(q.multi){let c=(U.testA[q.id]||[]).slice();if(i===0)c=c.includes(0)?[]:[0];else{c=c.filter(x=>x!==0);c=c.includes(i)?c.filter(x=>x!==i):c.concat(i)}U.testA[q.id]=c}else U.testA[q.id]=i;render();break}
  case 'test-prev':U.testI=Math.max(0,U.testI-1);render();window.scrollTo(0,0);break;
  case 'test-next':if(U.testI<TQ.length-1){U.testI++}else{S.test=evalTest(U.testA);if(S.test.rural&&S.user.zone!=='rural'){S.user.zone='rural'}if(S.user.zone==='rural')S.lowData=true;save();U.testRes=true}render();window.scrollTo(0,0);break;
  case 'test-done':U.testRes=false;U.tab='inicio';render();window.scrollTo(0,0);break;
  case 'retest':S.test=null;U.testStarted=false;U.testI=0;U.testA={};U.testRes=false;save();render();window.scrollTo(0,0);break;
  case 'go':go(d.t,d.s);break;
  case 'learn':U.learn=d.l;render();break;
  case 'aten':U.aten=d.a;U.book=null;render();break;
  case 'scan-sample':doScan(d.code);break;
  case 'scan-reset':U.scan='idle';U.rep=null;render();window.scrollTo(0,0);break;
  case 'open-an':{const an=S.analyses.find(x=>x.id===d.id);if(an){U.rep=mkReport(an.code);U.repId=an.id;U.scan='result';U.tab='analizar';render();window.scrollTo(0,0)}break}
  case 'chip':ask(d.q);break;
  case 'quiz-start':U.quiz={i:0,s:0,a:null};render();break;
  case 'quiz-exit':U.quiz=null;render();break;
  case 'quiz-ans':if(U.quiz.a==null){U.quiz.a=+d.i;if(U.quiz.a===QUIZ[U.quiz.i].c)U.quiz.s++;render()}break;
  case 'quiz-next':U.quiz.i++;U.quiz.a=null;render();window.scrollTo(0,0);break;
  case 'mstep':U.mdone=false;U.mstep=+d.i;U.mAcc=0;U.mplay=!RM;render();break;
  case 'mnext':{if(MS[U.mstep].v==='mirror')logTech('mirror',U.mchk.map(i=>'m'+i),U.mchk.length?'B':'');U.mstep=Math.min(MS.length-1,U.mstep+1);U.mAcc=0;U.mplay=!RM;render();window.scrollTo(0,0);break}
  case 'mside':U.mside=d.s;render();break;
  case 'fb-find':{const t=MS[U.mstep].tech,F=U.fb[t]=U.fb[t]||{sel:[],side:''};F.sel=F.sel.includes(d.k)?F.sel.filter(x=>x!==d.k):F.sel.concat(d.k);if(!F.sel.length)F.side='';render();break}
  case 'fb-side':U.fb[MS[U.mstep].tech].side=d.s;render();break;
  case 'fb-none':fbSave(true);break;
  case 'fb-save':fbSave(false);break;
  case 'mfinish':finishSession();render();window.scrollTo(0,0);break;
  case 'mrestart':U.mdone=false;U.mstep=0;U.mAcc=0;U.sess=null;U.fb={};U.mchk=[];render();window.scrollTo(0,0);break;
  case 'planv':U.plan=d.p;render();window.scrollTo(0,0);break;
  case 'hist-f':U.hf=d.f;render();break;
  case 'pdf':makePDF(d.id);break;
  case 'mprev':U.mstep=Math.max(0,U.mstep-1);U.mAcc=0;U.mplay=!RM;render();break;
  case 'mplay':U.mplay=!U.mplay;render();break;
  case 'mpress':{const T=PAT[MS[U.mstep].pat].T*1000;U.mAcc=(+d.i)*T+(U.mAcc%T);render();break}
  case 'book-start':U.book={c:d.id,reason:'',date:'',time:''};U.cal=0;render();window.scrollTo(0,0);break;
  case 'book-cancel':U.book=null;render();break;
  case 'book-reason':U.book.reason=d.r;render();break;
  case 'cal-prev':U.cal=Math.max(U.aten==='cesfam'?0:-12,U.cal-1);render();break;
  case 'cal-next':U.cal=Math.min(12,U.cal+1);render();break;
  case 'cal-day':if(U.book){U.book.date=d.d;U.book.time='';render()}else{U.calSel=d.d;render()}break;
  case 'book-time':U.book.time=d.t;render();break;
  case 'book-confirm':{const B=U.book,c=CESFAM.find(x=>x.id===B.c);S.appts.push({id:uid(),type:'cesfam',title:B.reason,reason:B.reason,place:c.name,date:B.date,time:B.time});save();U.book=null;toast('Hora confirmada');render();window.scrollTo(0,0);break}
  case 'appt-cancel':S.appts=S.appts.filter(x=>x.id!==d.id);save();toast('Hora cancelada');render();break;
  case 'tele-pro':U.tele={pro:d.id,date:'',time:''};render();break;
  case 'tele-day':U.tele.date=d.d;U.tele.time='';render();break;
  case 'tele-time':U.tele.time=d.t;render();break;
  case 'tele-confirm':{const p=PROS.find(x=>x.id===U.tele.pro);S.appts.push({id:uid(),type:'tele',title:p.n,place:'Teleconsulta'+(S.lowData?' · ahorro de datos':''),date:U.tele.date,time:U.tele.time});save();U.tele=null;toast('Teleconsulta reservada');render();break}
  case 'call':openCall(d.id);break;
  case 'call-mic':callSt.mic=!callSt.mic;$('#overlay').innerHTML=callHTML();break;
  case 'call-cam':callSt.cam=!callSt.cam;$('#overlay').innerHTML=callHTML();break;
  case 'call-end':closeCall();render();break;
  case 'farm-f':U.farmF=d.f;render();break;
  case 'plan-farm':{const e=$('#farm');if(e)e.scrollIntoView({behavior:RM?'auto':'smooth'});break}
  case 'farm-book':{const f=FARM.find(x=>x.id===d.id);S.appts.push({id:uid(),type:'farm',title:'Termografía mamaria',place:f.name,date:iso(addDays(today(),f.off)),time:f.time});save();toast('Examen reservado en '+f.name+(f.mirea?'':'. Esta farmacia no entrega informe MIREA'));render();break}
  case 'zone':S.user.zone=d.z;if(d.z==='rural')S.lowData=true;save();render();break;
  case 'logout':U.out=true;U.auth='login';U.err='';U.tab='inicio';render();window.scrollTo(0,0);break;
  case 'wipe':S=blank();save();U.sess=null;U.fb={};U.mdone=false;U.mstep=0;U.mchk=[];U.auth='register';U.testStarted=false;U.form=null;U.cons={};U.tab='inicio';U.chat=null;U.rep=null;U.scan='idle';render();window.scrollTo(0,0);toast('Datos borrados');break;
  }
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;act(t.dataset.act,t.dataset)});
document.addEventListener('change',e=>{
  const t=e.target.closest('[data-chg]');if(!t)return;const k=t.dataset.chg;
  if(k==='done'){const m=ymk(today());S.done[m]=S.done[m]||{};S.done[m][t.dataset.k]=t.checked;save();render()}
  else if(k==='remind'){S.remind[t.dataset.k]=t.checked;save();toast(t.checked?'Recordatorio activado':'Recordatorio desactivado');render()}
  else if(k==='selfday'){S.selfDay=+t.value;save();toast('Día actualizado');render()}
  else if(k==='lowdata'){S.lowData=t.checked;save();render()}
  else if(k==='mchk'){const i=+t.dataset.i;U.mchk=t.checked?U.mchk.concat(i):U.mchk.filter(x=>x!==i)}
  else if(k==='share'){const an=S.analyses.find(x=>x.id===t.dataset.id);if(an){an.shared=t.checked;save();toast(t.checked?'Se compartirá en tu próxima consulta':'Ya no se compartirá')}}
  else if(k==='callshare'){callSt.share=t.checked}
  else if(k==='cons'){U.cons[t.dataset.k]=t.checked;const b=$('#consbtn');if(b)b.disabled=!(U.cons.a&&U.cons.b)}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const fd=new FormData(f),k=f.dataset.form;
  if(k==='register'){
    const name=(fd.get('name')||'').trim(),email=(fd.get('email')||'').trim(),pass=fd.get('pass')||'';
    if(!name)U.err='Escribe tu nombre.';else if(!/^\S+@\S+\.\S+$/.test(email))U.err='Revisa tu correo electrónico.';else if(pass.length<6)U.err='La contraseña debe tener al menos 6 caracteres.';else if(!(U.cons.a&&U.cons.b))U.err='Marca las dos casillas obligatorias para continuar.';else U.err='';
    U.form={name:name,email:email,zone:fd.get('zone')||'urbana'};
    if(U.err){render();return}
    S=Object.assign(blank(),{user:{name:name,email:email,h:hash(pass),zone:fd.get('zone')||'urbana',consent:{v:1,at:iso(today()),stats:!!U.cons.c}}});U.form=null;U.cons={};U.testStarted=false;if(S.user.zone==='rural')S.lowData=true;save();U.out=false;U.chat=null;U.testI=0;U.testA={};render();window.scrollTo(0,0);
  }else if(k==='login'){
    const email=(fd.get('email')||'').trim(),pass=fd.get('pass')||'';
    const u=S.user;
    if(!u||!u.email||u.email!==email||u.h!==hash(pass)){U.form={email:email};U.err='No encontramos una cuenta con esos datos en este dispositivo. Revisa el correo y la contraseña, o crea una cuenta.';render();return}
    U.err='';U.form=null;U.out=false;U.tab='inicio';render();window.scrollTo(0,0);
  }else if(k==='chat'){const q=(fd.get('q')||'').trim();if(q)ask(q)}
  else if(k==='scan-code'){doScan(fd.get('code')||'')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#overlay').hidden){closeCall();render()}});
render();
})();
</script>

</body></html>
